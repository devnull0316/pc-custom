[[permission]]
identifier = "application-commands"
description = "Allows the main window to call Totonoe's fixed typed commands for catalog, setup, profiles, transactions, recovery, and read-only exports."
commands.allow = [
  "get_bootstrap_status",
  "pick_game_executable",
  "restart_explorer_shell",
  "list_actions",
  "detect_action",
  "preview_actions",
  "commit_preview",
  "commit_preview_as_trial",
  "confirm_trial",
  "list_timeline",
  "build_health_report",
  "taskbar_auto_hide_state",
  "set_taskbar_auto_hide",
  "hot_corner_get",
  "hot_corner_set",
  "rollback_item",
  "reconcile_now",
  "profiles_list",
  "profile_create",
  "profile_set_enabled",
  "profile_set_ribbon_color",
  "profile_run_now",
  "profile_restore_now",
  "profile_delete",
  "config_export",
  "config_import_preview",
  "config_import_apply",
  "setup_app_catalog",
  "setup_app_install",
  "config_snapshot_export",
  "theme_schedule_get",
  "theme_schedule_set",
  "storage_temp_cleanup_plan",
  "storage_temp_cleanup_apply",
  "storage_history_capture",
  "storage_history_list",
  "storage_history_clear",
  "open_windows_settings",
  "get_window_layout_status",
  "save_window_layout",
  "list_offscreen_windows",
  "rescue_offscreen_window",
  "rollback_offscreen_window"
]
