[package]
name = "totonoe"
version = "0.1.0"
description = "Windows を利用場面に合わせて、安全に整えて元へ戻す"
authors = ["Totonoe contributors"]
edition = "2021"
rust-version = "1.77.2"
license = "UNLICENSED"
publish = false

[lib]
name = "totonoe_core"
path = "src/lib.rs"

[[bin]]
name = "totonoe"
path = "src/main.rs"

[features]
default = []
test-support = []

[build-dependencies]
tauri-build = { version = "=2.2.0", features = [] }

[dependencies]
chrono = { version = "=0.4.38", features = ["serde"] }
crossbeam-channel = "=0.5.13"
hex = "=0.4.3"
parking_lot = "=0.12.3"
rand = "=0.8.5"
rusqlite = { version = "=0.32.1", features = ["bundled", "chrono", "uuid"] }
serde = { version = "=1.0.215", features = ["derive"] }
serde_json = "=1.0.133"
sha2 = "=0.10.8"
tauri = { version = "=2.2.5", features = ["tray-icon"] }
thiserror = "=2.0.3"
uuid = { version = "=1.11.0", features = ["v4", "serde"] }
winreg = "=0.52.0"
wmi = "=0.13.4"
windows = { version = "=0.58.0", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Memory",
  "Win32_System_Pipes",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "=3.14.0"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = "symbols"

