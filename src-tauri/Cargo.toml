[package]
name = "pc-custom"
version = "0.1.0"
description = "Windows の設定を利用場面に合わせて変更し、1件ずつ元へ戻す"
authors = ["PCカスタム contributors"]
edition = "2021"
rust-version = "1.82.0"
license = "UNLICENSED"
publish = false

[lib]
name = "pc_custom_core"
path = "src/lib.rs"

[[bin]]
name = "pc-custom"
path = "src/main.rs"

[features]
default = []
test-support = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
crossbeam-channel = "0.5"
hex = "0.4"
parking_lot = "0.12"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled", "chrono", "uuid"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
winreg = "0.52"
wmi = "0.13"
windows = { version = "0.58", features = [
  "Win32_Devices_Display",
  "Win32_Devices_FunctionDiscovery",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Printing",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_NetworkManagement_Rras",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Com",
  "Win32_System_Memory",
  "Win32_System_Pipes",
  "Win32_System_LibraryLoader",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_System_UpdateAgent",
  "Win32_System_WindowsProgramming",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_Accessibility",
  "Win32_UI_Controls",
  "Win32_UI_Controls_Dialogs",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
# panic = "abort" にしてはいけない。game_profile::watcher が catch_unwind で
# 監視スレッドのパニックを捕捉し、health へ記録して変更操作を fail-closed にする設計のため。
# abort だと出荷ビルドでだけこの安全機構が働かず、パニックでアプリ全体が即死する。
strip = "symbols"
